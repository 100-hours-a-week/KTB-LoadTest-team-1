services:
  mongo:
    image: mongo:8.3.4
    container_name: mongo-ktb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bootcamp-chat
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8.8.0
    container_name: redis-ktb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    labels:
      # 앱 코드가 spring.data.redis.*를 전혀 안 쓰고(Redisson 클라이언트를 직접 구성) 컨테이너가
      # 이거 하나만 있을 땐 무해했지만, redis-socketio가 추가되면서 Spring Boot가 두 컨테이너로
      # DataRedisConnectionDetails 빈을 동시에 만들려다 충돌한다 — 둘 다 auto-configure 대상에서 뺀다.
      org.springframework.boot.ignore: "true"

  # Socket.IO 전용 Redis (netty-socketio 자체 스토어 + ChatDataStore). 로컬 개발용 컨테이너 —
  # 배포 환경에서는 REDIS_SOCKETIO_HOST/PORT를 실제 서버(EC2 등)로 바꿔서 이 컨테이너 없이 붙인다.
  redis-socketio:
    image: redis:8.8.0
    container_name: redis-socketio-ktb
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_socketio_data:/data
    labels:
      org.springframework.boot.ignore: "true"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0
    container_name: mongodb-exporter-ktb
    restart: unless-stopped
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
    depends_on:
      - mongo

  redis-exporter:
    image: oliver006/redis_exporter:v1.86.0
    container_name: redis-exporter-ktb
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: prometheus-ktb
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.${ENVIRONMENT:-dev}.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./monitoring/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana-ktb
    restart: unless-stopped
    ports:
      - "9091:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources/prometheus.${ENVIRONMENT:-dev}.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
  redis_data:
  redis_socketio_data:
  prometheus_data:
  grafana_data:
