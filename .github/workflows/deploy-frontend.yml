name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ktb-chat-frontend
  DEPLOY_DIR: /home/ubuntu/ktb-chat-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir apps/frontend test

      - name: Configure AWS credentials
        if: ${{ vars.CDN_ASSET_PREFIX != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Build frontend and upload static assets to CDN
        env:
          CDN_ASSET_PREFIX: ${{ vars.CDN_ASSET_PREFIX }}
          CDN_ASSET_BUCKET: ${{ vars.CDN_ASSET_BUCKET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
        run: |
          set -eu
          trap 'rm -f apps/frontend/.env.production' EXIT
          {
            printf 'CDN_ASSET_PREFIX=%s\n' "$CDN_ASSET_PREFIX"
            printf 'CDN_ASSET_BUCKET=%s\n' "$CDN_ASSET_BUCKET"
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$NEXT_PUBLIC_API_URL"
            printf 'NEXT_PUBLIC_SOCKET_URL=%s\n' "$NEXT_PUBLIC_SOCKET_URL"
          } > apps/frontend/.env.production
          pnpm --dir apps/frontend run build:production

      - name: Remove production environment file
        if: always()
        run: rm -f apps/frontend/.env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            CDN_ASSET_PREFIX=${{ vars.CDN_ASSET_PREFIX }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, bastion]
    env:
      FRONTEND_HOSTS: ${{ vars.FRONTEND_HOSTS }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ktb-chat-frontend:${{ github.sha }}

    steps:
      - name: Deploy to frontend hosts
        run: |
          set -e

          if [ -z "${FRONTEND_HOSTS}" ]; then
            echo "FRONTEND_HOSTS variable is required"
            exit 1
          fi

          for host in ${FRONTEND_HOSTS}; do
            echo "Deploying frontend to ${host}"
            ssh -o StrictHostKeyChecking=accept-new "ubuntu@${host}" 'bash -s' <<EOF
          set -e
          mkdir -p "${{ env.DEPLOY_DIR }}"
          cd "${{ env.DEPLOY_DIR }}"
          cat > docker-compose.prod.yml <<'COMPOSE'
          services:
            frontend:
              image: ${FRONTEND_IMAGE}
              container_name: bootcamp-chat-frontend
              restart: unless-stopped
              ports:
                - "3000:3000"
          COMPOSE
          cat > .env <<'ENV'
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          ENV
          docker compose -f docker-compose.prod.yml pull
          docker rm -f bootcamp-chat-frontend 2>/dev/null || true
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          EOF
          done
