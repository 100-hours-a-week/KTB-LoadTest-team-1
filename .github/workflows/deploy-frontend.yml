name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: ktb-chat-frontend
  DEPLOY_DIR: /home/ubuntu/ktb-chat-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir apps/frontend test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, bastion]
    env:
      FRONTEND_HOSTS: ${{ vars.FRONTEND_HOSTS }}
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ktb-chat-frontend:${{ github.sha }}

    steps:
      - name: Deploy to frontend hosts
        run: |
          set -e

          if [ -z "${FRONTEND_HOSTS}" ]; then
            echo "FRONTEND_HOSTS variable is required"
            exit 1
          fi

          for host in ${FRONTEND_HOSTS}; do
            echo "Deploying frontend to ${host}"
            ssh -o StrictHostKeyChecking=accept-new "ubuntu@${host}" 'bash -s' <<EOF
          set -e
          mkdir -p "${{ env.DEPLOY_DIR }}"
          cd "${{ env.DEPLOY_DIR }}"
          cat > docker-compose.prod.yml <<'COMPOSE'
          services:
            frontend:
              image: ${FRONTEND_IMAGE}
              container_name: bootcamp-chat-frontend
              restart: unless-stopped
              ports:
                - "3000:3000"
          COMPOSE
          cat > .env <<'ENV'
          FRONTEND_IMAGE=${FRONTEND_IMAGE}
          ENV
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          EOF
          done
